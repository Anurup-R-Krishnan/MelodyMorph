[project]
name = "melodymorph"
version = "0.1.0"
description = "A Transformer-based melody continuation and variation generator"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "music21>=9.1",
    "mido>=1.3",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# width="stretch" (app/streamlit_app.py) replaced use_container_width; the
# width parameter rollout completed in 1.52, so earlier versions raise TypeError
app = ["streamlit>=1.52"]
dev = ["pytest>=8.0", "ruff>=0.6", "streamlit>=1.52"]

[project.scripts]
melodymorph = "melodymorph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["melodymorph"]

[tool.uv.sources]
# CUDA wheels only where they exist; macOS gets the default (CPU/MPS) build
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "B905"]

[tool.ruff.lint.per-file-ignores]
"app/*" = ["E501"]  # inline CSS
"melodymorph/artwork.py" = ["E501"]  # SVG/HTML markup templates
"scripts/legacy/*" = ["ALL"]  # verbatim old code, kept for ablations
