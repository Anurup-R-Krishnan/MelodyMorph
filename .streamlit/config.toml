[theme]
base = "light"
primaryColor = "#12100E"
backgroundColor = "#F2512B"
secondaryBackgroundColor = "#F5F4EF"
textColor = "#12100E"
font = "Archivo"
baseRadius = "none"
borderColor = "#12100E"
showWidgetBorder = true

[[theme.fontFaces]]
family = "Archivo"
url = "app/static/fonts/archivo-latin.woff2"
weight = "100 900"

[server]
enableStaticServing = true
