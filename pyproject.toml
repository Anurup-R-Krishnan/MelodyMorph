[project]
name = "melodymorph"
version = "0.1.0"
description = "A Transformer-based melody continuation and variation generator"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "music21>=9.1",
    "mido>=1.3",
    "matplotlib>=3.8",
    "streamlit>=1.36",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
melodymorph = "melodymorph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["melodymorph"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
